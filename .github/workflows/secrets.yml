name: secrets

on:
  push:
  pull_request:

jobs:
  scan:
    name: fail if any committed file looks like a real secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A plain node readdir+readFile walk is the right scanner here: CI has no gm port, so this is not a code-search question.
      - name: Scan the work tree
        run: |
          cat > "$RUNNER_TEMP/secret-scan.mjs" <<'NODE'
          import { readdirSync, readFileSync, lstatSync } from "node:fs";
          import { join, relative, sep } from "node:path";

          const MAX_FILES = 20000;
          const MAX_BYTES = 1048576;
          const MAX_DEPTH = 12;
          const SKIP_DIRS = new Set([".git", "node_modules", "build", "dist", ".gm", "managed_components", "gc-secrets"]);
          const SELF = ".github/workflows/secrets.yml";
          const CONTROL_CHARS = new RegExp("[" + String.fromCharCode(0) + "-" + String.fromCharCode(8) + "]");

          const RULES = [
            { id: "private-key-pem", re: /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/ },
            { id: "aws-access-key-id", re: /\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b/ },
            { id: "base64-32-byte-psk-or-pepper", re: /(?:PEPPER|PSK)[A-Z_]*\s*[:=]\s*["']?([A-Za-z0-9+/_-]{43}=?)["']?/ },
          ];

          const findings = [];
          let scanned = 0;

          const walk = (dir, depth) => {
            if (depth > MAX_DEPTH || scanned > MAX_FILES) return;
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (scanned > MAX_FILES) return;
              const full = join(dir, entry.name);
              if (entry.isDirectory()) {
                if (SKIP_DIRS.has(entry.name)) continue;
                walk(full, depth + 1);
                continue;
              }
              if (!entry.isFile()) continue;
              const rel = relative(process.cwd(), full).split(sep).join("/");
              if (rel === SELF) continue;
              if (entry.name.startsWith(".env") && entry.name !== ".env.example") {
                findings.push({ rule: "committed-dotenv", file: rel, line: 0, detail: entry.name });
                continue;
              }
              let size;
              try {
                size = lstatSync(full).size;
              } catch {
                continue;
              }
              if (size > MAX_BYTES) continue;
              let text;
              try {
                text = readFileSync(full, "utf8");
              } catch {
                continue;
              }
              scanned++;
              if (CONTROL_CHARS.test(text)) continue;
              const lines = text.split("\n");
              for (let i = 0; i < lines.length; i++) {
                for (const rule of RULES) {
                  const hit = rule.re.exec(lines[i]);
                  if (hit === null) continue;
                  if (rule.id === "base64-32-byte-psk-or-pepper") {
                    const value = hit[1];
                    if (Buffer.from(value, "base64").length !== 32) continue;
                    if (/^(?:example|placeholder|changeme|redacted|your|xxx|test)/i.test(value)) continue;
                  }
                  findings.push({
                    rule: rule.id,
                    file: rel,
                    line: i + 1,
                    detail: lines[i].replace(hit[0], "<redacted>").trim().slice(0, 100),
                  });
                }
              }
            }
          };

          walk(process.cwd(), 0);

          if (findings.length > 0) {
            console.error("committed secret candidates: " + findings.length);
            for (const f of findings) {
              console.error("  " + f.rule + " " + f.file + (f.line > 0 ? ":" + f.line : "") + " " + f.detail);
            }
            process.exit(1);
          }
          console.log("scanned " + scanned + " files, no secret candidates found");
          NODE
          node "$RUNNER_TEMP/secret-scan.mjs"
