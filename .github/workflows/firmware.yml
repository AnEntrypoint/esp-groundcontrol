name: firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (esp32s2, size + partition limits; warnings are not fatal)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache IDF build directory
        uses: actions/cache@v4
        with:
          path: build
          key: idf-build-${{ runner.os }}-${{ hashFiles('main/**/*', 'sdkconfig.defaults') }}
          restore-keys: |
            idf-build-${{ runner.os }}-

      - name: idf.py set-target esp32s2
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s2

      - name: idf.py build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: idf.py size and idf.py size-files
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py size 2>&1 | tee size-report.txt
          idf.py size-files 2>&1 | tee size-files-report.txt

      - name: Check every app image fits its slot (factory 0x100000, ota_0 and ota_1 0x170000)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/app-fit.py" <<'PY'
          import os
          import re
          import sys

          PINNED = {"factory": 0x100000, "ota_0": 0x170000, "ota_1": 0x170000}

          slots = []
          with open("partitions.csv", encoding="utf-8") as handle:
              for raw in handle:
                  line = raw.split("#")[0].strip()
                  if line == "":
                      continue
                  cols = [c.strip() for c in line.split(",")]
                  if len(cols) < 5 or cols[1] != "app":
                      continue
                  try:
                      size = int(cols[4], 0)
                  except ValueError:
                      continue
                  if size > 0:
                      slots.append((cols[0], size))
          if not slots:
              slots = list(PINNED.items())

          report = ""
          if os.path.exists("size-report.txt"):
              with open("size-report.txt", encoding="utf-8", errors="replace") as handle:
                  report = handle.read()

          def figure(pattern):
              found = re.search(pattern, report)
              return int(found.group(1)) if found else 0

          app_bytes = max(
              figure(r"Total image size:\s*~?\s*(\d+)"),
              figure(r"Used Flash size\s*:\s*(\d+)"),
          )
          if os.path.isdir("build"):
              for name in os.listdir("build"):
                  if not name.endswith(".bin"):
                      continue
                  if name == "bootloader.bin" or name.startswith("partition"):
                      continue
                  app_bytes = max(app_bytes, os.path.getsize(os.path.join("build", name)))

          if app_bytes <= 0:
              sys.exit("app image size not found: no size report figure and no app .bin under build/")

          print("app image {} bytes (0x{:x})".format(app_bytes, app_bytes))
          over = False
          for name, size in slots:
              limit = PINNED.get(name, size)
              ok = app_bytes <= limit
              if not ok:
                  over = True
              print(
                  "  {}   {} {} / {} bytes ({:.1f}% used, headroom {})".format(
                      "ok" if ok else "OVER",
                      name,
                      app_bytes,
                      limit,
                      (app_bytes / limit) * 100,
                      limit - app_bytes,
                  )
              )
          if over:
              sys.exit("app image does not fit: raise the slot in partitions.csv or shrink the image")
          PY
          python3 "$RUNNER_TEMP/app-fit.py"

      - name: Upload size reports
        uses: actions/upload-artifact@v4
        with:
          name: firmware-size-reports
          if-no-files-found: error
          path: |
            size-report.txt
            size-files-report.txt

  warnings:
    name: build (esp32s2, -Werror via EXTRA_CFLAGS; allowed to fail on pre-existing warnings)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    continue-on-error: true
    env:
      EXTRA_CFLAGS: -Werror
      EXTRA_CXXFLAGS: -Werror
      EXTRA_CPPFLAGS: -Werror
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore IDF build directory
        uses: actions/cache@v4
        with:
          path: build
          key: idf-build-${{ runner.os }}-${{ hashFiles('main/**/*', 'sdkconfig.defaults') }}
          restore-keys: |
            idf-build-${{ runner.os }}-

      - name: idf.py set-target esp32s2
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s2

      - name: idf.py build with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          echo "EXTRA_CFLAGS=$EXTRA_CFLAGS"
          idf.py build
